# SISWA frontend: serves the built SPA on 4069 and proxies /api to the backend.
server {
    listen 4069;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets can be cached aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: every unknown path is handled by the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Server-Sent Events stream: no buffering, no timeout.
    location /api/v1/logs/stream {
        proxy_pass http://backend:3069;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    location /api/ {
        proxy_pass http://backend:3069;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI served by the backend, reachable through the same origin.
    location /swagger {
        proxy_pass http://backend:3069;
        proxy_set_header Host $host;
    }
}
